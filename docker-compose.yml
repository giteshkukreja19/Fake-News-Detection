version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: fakenews_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: fakenews_db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fakenews_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/
      FLASK_ENV: production
    volumes:
      - ./backend:/app
    command: gunicorn app:app -w 4 -b 0.0.0.0:5000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fakenews_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:5000

volumes:
  mongo_data:
